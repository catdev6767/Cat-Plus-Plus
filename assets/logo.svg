<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Nền tròn -->
  <circle cx="100" cy="100" r="95" fill="#0a0e1a" stroke="url(#grad)" stroke-width="4"/>

  <!-- Đầu mèo -->
  <ellipse cx="100" cy="110" rx="55" ry="50" fill="url(#grad)"/>

  <!-- Tai trái -->
  <polygon points="55,75 65,35 90,60" fill="url(#grad)"/>
  <polygon points="62,72 68,48 83,65" fill="#ffb6b6"/>

  <!-- Tai phải -->
  <polygon points="145,75 135,35 110,60" fill="url(#grad)"/>
  <polygon points="138,72 132,48 117,65" fill="#ffb6b6"/>

  <!-- Mắt trái -->
  <ellipse cx="80" cy="105" rx="10" ry="12" fill="#0a0e1a"/>
  <ellipse cx="82" cy="103" rx="3" ry="4" fill="#fff"/>

  <!-- Mắt phải -->
  <ellipse cx="120" cy="105" rx="10" ry="12" fill="#0a0e1a"/>
  <ellipse cx="122" cy="103" rx="3" ry="4" fill="#fff"/>

  <!-- Mũi -->
  <polygon points="100,120 95,127 105,127" fill="#ffb6b6"/>

  <!-- Miệng -->
  <path d="M 100 127 Q 92 135 85 130" stroke="#0a0e1a" stroke-width="2" fill="none"/>
  <path d="M 100 127 Q 108 135 115 130" stroke="#0a0e1a" stroke-width="2" fill="none"/>

  <!-- Ria trái -->
  <line x1="45" y1="115" x2="75" y2="120" stroke="#0a0e1a" stroke-width="1.5"/>
  <line x1="45" y1="125" x2="75" y2="127" stroke="#0a0e1a" stroke-width="1.5"/>

  <!-- Ria phải -->
  <line x1="155" y1="115" x2="125" y2="120" stroke="#0a0e1a" stroke-width="1.5"/>
  <line x1="155" y1="125" x2="125" y2="127" stroke="#0a0e1a" stroke-width="1.5"/>

  <!-- Dấu ++ -->
  <text x="100" y="185" font-family="monospace" font-size="24" font-weight="bold"
        text-anchor="middle" fill="url(#grad)">++</text>
</svg>
