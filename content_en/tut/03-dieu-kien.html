<p>Branch with <code>sniff</code> / <code>swat</code>.</p>
<h2>Syntax</h2>
<pre><code>sniff dieu_kien
    code_neu_dung
swat
    code_neu_sai</code></pre>
<h2>Examples</h2>
<pre><code>paw age = 3
sniff age > 2
    meow "Mèo lớn"
swat
    meow "Mèo con"</code></pre>
<h2>So sánh</h2>
<table>
<tr><th>Toán tử</th><th>Nghĩa</th></tr>
<tr><td><code>==</code></td><td>Bằng</td></tr>
<tr><td><code>!=</code></td><td>Khác</td></tr>
<tr><td><code>&lt;</code>, <code>&gt;</code></td><td>Nhỏ / lớn</td></tr>
<tr><td><code>&lt;=</code>, <code>&gt;=</code></td><td>Nhỏ bằng / lớn bằng</td></tr>
</table>
