<p>Text processing.</p>
<h2>Concat</h2>
<pre><code>meow "Hello, " + "Cat!"</code></pre>
<h2>Độ dài</h2>
<pre><code>meow tail("hello")</code></pre>
<h2>Hoa / thường</h2>
<pre><code>meow puff("hello")
meow melt("HELLO")</code></pre>
<h2>Cắt</h2>
<pre><code>meow nip("Hello, Cat!", 0, 5)</code></pre>
<h2>Interpolation</h2>
<pre><code>paw name = "Tom"
meow "Hello, {name}!"</code></pre>
<h2>Exercises</h2>
<p>Viết function đảo ngược string <code>"hello"</code> thành <code>"olleh"</code>.</p>
