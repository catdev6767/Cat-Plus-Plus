<p>Không để chương trình dừng khi có lỗi.</p>
<h2>Syntax</h2>
<pre><code>tap
    paw x = 1 / 0
hiss e
    meow "Lỗi: " + e</code></pre>
<h2>Ứng dụng</h2>
<pre><code>paw nums = [10, 0, 5]
groom n of nums
    tap
        meow 100 / n
    hiss e
        meow "Bỏ qua " + say(n)</code></pre>
<h2>Lesson tập</h2>
<p>Cho <code>["10", "abc", "20"]</code>, thử chuyển sang số, bỏ qua phần tử lỗi.</p>
