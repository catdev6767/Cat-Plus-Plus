<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat++ v3 — IDE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
</head>
<body>

<!-- TITLEBAR -->
<div class="menubar">
  <button id="hamburger" title="Menu"><i class="fas fa-bars"></i></button>
  <span class="title">Cat++ <small>v3</small></span>
  <a href="../" class="menu-item" title="Home" style="text-decoration:none"><i class="fas fa-home"></i> Home</a>
  <a href="../docs/" class="menu-item" target="_blank" style="text-decoration:none"><i class="fas fa-book"></i> Docs</a>
  <span class="menu-item" data-menu="examples"><i class="fas fa-code"></i> Examples</span>
  <span class="menu-item" data-menu="cheatsheet"><i class="fas fa-list"></i> Cheatsheet</span>
  <span class="menu-item" data-menu="shortcuts"><i class="fas fa-keyboard"></i> Shortcuts</span>
  <div class="spacer"></div>
  <button id="run-btn" class="tb-icon-btn" title="Run (Ctrl+Enter)"><i class="fas fa-play" style="color:#3b82f6"></i></button>
  <button id="clear-btn" class="tb-icon-btn" title="Clear"><i class="fas fa-trash"></i></button>
  <button id="benchmark-btn" class="tb-icon-btn" title="Benchmark"><i class="fas fa-tachometer-alt"></i></button>
  <button id="transpile-btn" class="tb-icon-btn" title="Transpile to C"><i class="fas fa-cog"></i></button>
  <button id="transpile-native-btn" class="tb-icon-btn" title="Native"><i class="fas fa-bolt"></i></button>
  <button id="split-btn" class="tb-icon-btn" title="Split"><i class="fas fa-columns"></i></button>
  <button id="theme-btn" class="tb-icon-btn" title="Theme"><i class="fas fa-adjust"></i></button>
  <button id="zen-btn" class="tb-icon-btn" title="Zen mode"><i class="fas fa-expand"></i></button>
  <button id="lang-btn" class="tb-icon-btn" title="Language"><span id="lang-flag">EN</span></button>
</div>

<!-- MAIN LAYOUT -->
<div class="layout">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <span>EXPLORER</span>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">PROJECT</div>
      <div class="project-bar">
        <select id="project-selector" class="project-select"></select>
        <button id="project-new" class="mini-btn" title="New"><i class="fas fa-plus"></i></button>
        <button id="project-rename" class="mini-btn" title="Rename"><i class="fas fa-pen"></i></button>
        <button id="project-delete" class="mini-btn" title="Delete"><i class="fas fa-trash"></i></button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-title">FILES</div>
      <div id="file-tree" class="file-tree"></div>
    </div>
  </aside>

  <!-- MAIN COLUMN -->
  <div id="main-col" class="main-col">

    <!-- TABS -->
    <div id="tabs" class="tabs"></div>

    <!-- EDITOR AREA -->
    <div id="main-body" class="main-body">
      <div id="editor" class="editor"></div>
      <div id="split-divider" class="split-divider" style="display:none"></div>
      <div id="editor-split" class="editor" style="display:none">
        <div id="editor-2" class="editor-inner"></div>
      </div>
    </div>

    <!-- TERMINAL PANEL -->
    <div id="panel" class="panel">
      <div class="panel-header">
        <span class="panel-tab active">TERMINAL</span>
        <button id="act-terminal" class="panel-btn" title="Toggle"><i class="fas fa-chevron-down"></i></button>
      </div>
      <div id="terminal" class="terminal"></div>
    </div>

    <!-- STATUS BAR -->
    <div class="statusbar">
      <span id="status">Ready</span>
      <div class="spacer"></div>
      <span id="cursor-pos">Ln 1, Col 1</span>
    </div>

  </div>
</div>

<!-- DRAWER (mobile) -->
<div id="drawer-backdrop" class="drawer-backdrop"></div>
<aside id="drawer" class="drawer">
  <div class="drawer-header">
    <span>🐱 Cat++</span>
    <button id="drawer-close"><i class="fas fa-times"></i></button>
  </div>
  <div id="drawer-body" class="drawer-body">
    <div class="drawer-section">
      <div class="drawer-section-title">Get Started</div>
      <a class="drawer-item" data-menu="examples"><i class="fas fa-code"></i> Examples</a>
      <a class="drawer-item" data-menu="cheatsheet"><i class="fas fa-list"></i> Cheatsheet</a>
      <a class="drawer-item" data-menu="shortcuts"><i class="fas fa-keyboard"></i> Shortcuts</a>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">File</div>
      <a class="drawer-item" id="act-new"><i class="fas fa-file"></i> New file</a>
      <a class="drawer-item" id="act-download"><i class="fas fa-download"></i> Download</a>
      <a class="drawer-item" id="act-upload"><i class="fas fa-upload"></i> Open file</a>
      <a class="drawer-item" id="act-share"><i class="fas fa-share-alt"></i> Share link</a>
      <a class="drawer-item" id="act-export"><i class="fas fa-file-export"></i> Export</a>
      <a class="drawer-item" id="act-import"><i class="fas fa-file-import"></i> Import</a>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">Run</div>
      <a class="drawer-item" id="act-run"><i class="fas fa-play"></i> Run</a>
      <a class="drawer-item" id="act-clear"><i class="fas fa-trash"></i> Clear terminal</a>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">Appearance</div>
      <a class="drawer-item" id="act-theme"><i class="fas fa-adjust"></i> Theme</a>
      <a class="drawer-item" id="act-sidebar"><i class="fas fa-columns"></i> Toggle sidebar</a>
      <a class="drawer-item" id="act-minimap"><i class="fas fa-map"></i> Minimap</a>
    </div>
  </div>
</aside>

<!-- HIDDEN INPUTS -->
<input id="file-input" type="file" style="display:none">
<input id="file-import-input" type="file" style="display:none">

<!-- MODAL -->
<div id="modal-backdrop" class="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <span id="modal-title">Title</span>
      <button id="modal-close"><i class="fas fa-times"></i></button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>

<script src="pyodide-runner.js"></script>
<script src="app.js"></script>
</body>
</html>
